<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="fryGradientDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#660000" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3D Paper Airplane / Origami shape -->
  <g filter="url(#glow)">
    <!-- Top left face (brightest) -->
    <polygon points="30,65 50,20 50,50" fill="url(#fryGradient)" />
    <!-- Top right face -->
    <polygon points="50,20 70,40 50,50" fill="#CC0000" />
    <!-- Bottom face (darkest) -->
    <polygon points="30,65 50,50 70,75" fill="url(#fryGradientDark)" />
    <!-- Right face -->
    <polygon points="50,50 70,40 70,75" fill="#990000" />
    <!-- Edge highlights -->
    <line x1="50" y1="20" x2="50" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
    <line x1="30" y1="65" x2="50" y2="50" stroke="rgba(255,255,255,0.1)" stroke-width="0.5" />
  </g>
</svg>
