[project]
name = "fryswap-contracts"
version = "0.1.0"
description = "FrySwap Algorand Smart Contracts"
requires-python = ">=3.10"
dependencies = [
    "pyteal>=0.25.0",
    "py-algorand-sdk>=2.4.0",
    "algokit-utils>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "black>=23.0.0",
    "mypy>=1.7.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
